schema: spec-driven

# heterodyne project context (ADR 0004). See openspec/README.md.
context: |
  Every change belongs to one GitHub issue. The change folder is named <issue>-<slug>,
  for example 12-show-blocked-reason, and proposal.md starts with the line "Issue: #<issue>".
  Capabilities, one living spec each under openspec/specs/<capability>/spec.md:
  hub, daemon, mcp, hooks, overlap, messaging, knowledge, tickets, tui, cli, install.
  Use one of these names. The owner approves specs (ADR 0004), so a new capability is proposed to the owner first.
  A number in a requirement (limit, timeout, size, default) cites where it comes from:
  the client's requirement, an ADR in docs/decisions/, or "Open decision" (ADR 0001).

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
