# actions/labeler v7 rules (workflow: .github/workflows/labeler.yml).
# Paths follow the planned layout: internal/<capability>/** for each
# capability, cmd/** for the CLI entry point, and each capability's living
# and delta specs (openspec/specs/<capability>/, openspec/changes/<id>/specs/
# <capability>/, ADR 0004). Labels themselves come from
# scripts/github-setup.sh.

cap:hub:
  - changed-files:
      - any-glob-to-any-file:
          - internal/hub/**
          - openspec/specs/hub/**
          - openspec/changes/*/specs/hub/**

cap:daemon:
  - changed-files:
      - any-glob-to-any-file:
          - internal/daemon/**
          - openspec/specs/daemon/**
          - openspec/changes/*/specs/daemon/**

